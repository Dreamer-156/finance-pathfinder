name: Deploy graduate radar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check types
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Check application behavior
        run: node --test test/screening.test.mjs test/program-views.test.mjs test/program-groups.test.mjs test/overseas-catalog.test.mjs test/source-worker.test.mjs test/browser-state.test.mjs test/program-search.test.mjs
      - name: Check public official sources
        run: npm run check:pages-sources
      - name: Build static website
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
